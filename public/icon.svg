<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#16181d"/>
  <!-- Знак-граф: путь углом из трёх узлов — зависимость, а не буква.
       Сходящуюся «галочку» и веер из трёх узлов пришлось отбросить: первая
       слипается в сплошную V уже на 26px, второй — в точности стандартный
       значок «поделиться».
       Всё лежит внутри центральных 80%: иначе maskable-обрезка срежет узлы. -->
  <g stroke="#fff" stroke-width="25" stroke-linecap="round">
    <path d="M171 230 L171 282"/>
    <path d="M230 341 L282 341"/>
  </g>
  <g fill="#fff">
    <circle cx="171" cy="171" r="55"/>
    <circle cx="171" cy="341" r="55"/>
    <circle cx="341" cy="341" r="55"/>
  </g>
</svg>
