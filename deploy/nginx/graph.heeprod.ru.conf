# Graph Studio: TLS на хосте, статику отдаёт контейнер graph-studio на 127.0.0.1:8081.
#
# Установка:
#   cp deploy/nginx/graph.heeprod.ru.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/graph.heeprod.ru.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Сертификат выпускается отдельно (webroot, без правки конфигов nginx):
#   certbot certonly --webroot -w /var/www/html -d graph.heeprod.ru

server {
    listen 80;
    listen [::]:80;
    server_name graph.heeprod.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 через флаг listen: на Ubuntu 24.04 nginx 1.24, отдельной директивы
    # `http2 on;` там ещё нет (появилась в 1.25.1)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name graph.heeprod.ru;

    ssl_certificate     /etc/letsencrypt/live/graph.heeprod.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graph.heeprod.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/graph-studio.access.log;
    error_log  /var/log/nginx/graph-studio.error.log;

    # приложение целиком клиентское, но экспорт/импорт ходит через большие JSON
    client_max_body_size 32m;

    # HSTS: домен работает только по https
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8081/healthz;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
