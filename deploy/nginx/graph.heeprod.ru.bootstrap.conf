# Bootstrap-конфиг: только HTTP. Нужен один раз, чтобы Let's Encrypt смог
# пройти ACME http-01 challenge до того, как появится сертификат.
# После выпуска сертификата заменяется на graph.heeprod.ru.conf.

server {
    listen 80;
    listen [::]:80;
    server_name graph.heeprod.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
