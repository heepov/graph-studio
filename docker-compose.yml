name: graph-studio

services:
  # Бэкенд: аккаунты, доски, ссылки-доступы. Наружу НЕ торчит — только через
  # тот же контейнерный nginx по пути /api/, поэтому host-nginx менять не нужно
  # и лишний порт на общем сервере не занимается.
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: graph-studio-api:latest
    container_name: graph-studio-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Почта администратора. Пароль СЮДА НЕ КЛАДЁТСЯ: при первом запуске он
      # генерируется случайным и печатается один раз в лог контейнера.
      # Прочитать: docker compose logs api | grep -A3 'ПЕРВЫЙ ЗАПУСК'
      ADMIN_EMAIL: "${GRAPH_STUDIO_ADMIN:-kaitnik@gmail.com}"
      DB_PATH: /data/graphstudio.sqlite
      # Внешний адрес сервиса. Он же issuer для OAuth и имя ресурса для MCP:
      # токен привязывается к нему, и разъехавшийся адрес означает, что коннектор
      # перестанет принимать собственные токены. Локально переопределяется
      # переменной GRAPH_STUDIO_PUBLIC_URL (см. scripts/verify.sh).
      PUBLIC_URL: "${GRAPH_STUDIO_PUBLIC_URL:-https://graph.heeprod.ru}"
      BACKUP_DIR: /data/backups
      LOG_LEVEL: info
    # Секреты, если появятся, кладутся сюда. Файла может не быть — тогда работают
    # умолчания выше, и деплой не падает из-за его отсутствия.
    env_file:
      - path: /etc/graph-studio/api.env
        required: false
    volumes:
      # ИМЕНОВАННЫЙ том, а не каталог в репозитории: деплой делает git reset --hard
      # в /opt/graph-studio, и данные внутри репозитория были бы под ударом.
      - gs-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: graph-studio:latest
    container_name: graph-studio
    restart: unless-stopped
    depends_on:
      - api
    # только на loopback — наружу ходит host-nginx, он же держит TLS
    ports:
      - "127.0.0.1:${GRAPH_STUDIO_PORT:-8081}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Витрина heeprod.ru подхватывает проект по этим меткам сама:
    # ничего пересобирать и никуда ходить не нужно, достаточно обычного деплоя.
    # Описание полей — https://github.com/heepov/heeprod-homepage/blob/main/docs/LABELS.md
    labels:
      ru.heeprod.showcase.enabled: "true"
      ru.heeprod.showcase.slug: "graph-studio"
      ru.heeprod.showcase.name: "Graph Studio"
      ru.heeprod.showcase.tagline: "Редактор графов зависимостей, роадмапов и схем «что чем заблокировано»"
      ru.heeprod.showcase.url: "https://graph.heeprod.ru/"
      ru.heeprod.showcase.health: "/healthz"
      ru.heeprod.showcase.repo: "https://github.com/heepov/graph-studio"
      ru.heeprod.showcase.tags: "веб,инструмент,графы,SPA"
      ru.heeprod.showcase.visibility: "public"
      ru.heeprod.showcase.stage: "live"
      ru.heeprod.showcase.order: "10"
      ru.heeprod.showcase.accent: "#5B8DEF"

volumes:
  gs-data:
    name: graph-studio_gs-data
