# WebSocket: Connection должен быть "upgrade" только когда клиент этого просит,
# иначе обычные запросы получат некорректный заголовок.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Nginx внутри контейнера: раздаёт статику Graph Studio.
# Снаружи перед ним стоит host-nginx, который держит TLS и проксирует сюда.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;                 # «/» открывает приложение

    charset utf-8;
    charset_types text/html text/css application/javascript application/json application/manifest+json;

    # .webmanifest есть не во всех версиях mime.types — задаём явно
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js;
        application/json                      json;
        application/manifest+json             webmanifest;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/x-icon                          ico;
        text/plain                            txt md;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # namespace для IndexedDB/FSA привязан к origin — вложение в чужой iframe только запрещает
    add_header X-Frame-Options "SAMEORIGIN" always;

    # app-shell не кэшируем: иначе обновление приложения не доедет до открытых вкладок
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Ассеты сборки лежат с хэшем в имени: содержимое по такому адресу неизменно,
    # поэтому кэшируем надолго. Новая сборка — новые имена.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Шаблон просмотрщика тянется приложением через fetch при экспорте viewer.html.
    # Он меняется с каждой сборкой, поэтому не кэшируем.
    location = /viewer-template.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Старый адрес до перехода на сборку — уводим на корень, чтобы закладки не отваливались.
    location = /graph_studio.html {
        return 301 /;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
    location = /icon.svg {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # health для деплой-скрипта и docker healthcheck
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

# Бэкенд. Прокси стоит ДО общего location / — префиксное совпадение точнее,
    # поэтому SPA-фолбэк сюда не дотянется и на упавший запрос не придёт HTML.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # WebSocket для совместного редактирования пойдёт этим же путём
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # add_header в nginx НЕ наследуется: как только в блоке появляется свой,
        # все внешние перестают действовать — поэтому дублируем, как везде в этом файле.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Ссылки-доступы: токен не должен утечь в Referer на сторонние ресурсы.
    # Регулярка в кавычках: без них nginx принимает {16,64} за начало блока
    # и падает с «unknown directive».
    location ~ "^/(s|e)/[A-Za-z0-9_-]{16,64}$" {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }

    location / {
        # SPA: у приложения появились собственные адреса — /b/<доска>,
        # /s/<токен> просмотр, /e/<токен> правка, /admin, /login. Их на диске нет,
        # поэтому неизвестный путь отдаём оболочку, а не 404.
        try_files $uri $uri/ /index.html;
    }
}
