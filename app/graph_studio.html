<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3355d1">
<meta name="mobile-web-app-capable" content="yes">
<!-- apple-* оставлен для старых iOS Safari: стандартный тег там ещё не понимается -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Graph Studio">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --ink:#15181f; --ink2:#525a6b; --muted:#8b91a1; --line:#e4e7ef; --line2:#eef0f6;
  --bg:#f6f7fa; --card:#fff; --accent:#3355d1; --accent-bg:#eef1fc; --accent-br:#d3dcf7;
  --red:#b3261e; --red-bg:#fdecea; --red-br:#f0c7c2;
  --amber:#8a5d00; --amber-bg:#fff5da; --amber-br:#ecd8a0;
  --green:#136c33; --green-bg:#e4f3e8; --green-br:#b9dfc4;
  --grey:#5f6673; --grey-bg:#eef0f4; --grey-br:#dbdfe8;
  --sh1:0 1px 2px rgba(16,20,32,.06); --sh2:0 4px 14px rgba(16,20,32,.10); --sh3:0 16px 46px rgba(16,20,32,.20);
  --side:236px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d3d7e2;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#bcc2d1;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ каркас ============ */
#app{display:flex;height:100vh}
#side{width:var(--side);min-width:var(--side);background:#fbfbfd;border-right:1px solid var(--line);display:flex;flex-direction:column}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:46px;min-height:46px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px}
#pagebar{min-height:40px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:7px;padding:5px 12px;flex-wrap:wrap}
#view{flex:1;min-height:0;position:relative;overflow:hidden}
.scroller{position:absolute;inset:0;overflow:auto;padding:18px 22px 60px}

/* ============ сайдбар ============ */
.brand{padding:12px 12px 8px;display:flex;align-items:center;gap:8px}
.brand .logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#3355d1,#7b3fd1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
.brand .nm{font-weight:750;font-size:14px;letter-spacing:-.2px}
#projBtn{margin:0 8px 8px;padding:7px 9px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;width:calc(100% - 16px)}
#projBtn:hover{border-color:#c8cede;box-shadow:var(--sh1)}
#projBtn .pn{font-weight:700;font-size:12.8px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#projBtn .cnt{font-size:10.5px;color:var(--muted)}
.sidecap{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#a6acbb;padding:10px 14px 4px;display:flex;align-items:center}
.sidecap .add{margin-left:auto;cursor:pointer;font-size:14px;color:var(--muted);line-height:1;padding:0 3px;border-radius:4px}
.sidecap .add:hover{background:#eceff6;color:var(--ink)}
#pageList{flex:1;overflow:auto;padding:0 8px 10px}
.pgi{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12.8px;color:var(--ink2);user-select:none}
.pgi:hover{background:#eff1f7}
.pgi.on{background:var(--accent-bg);color:var(--accent);font-weight:650}
.pgi .ic{width:15px;text-align:center;font-size:12px;opacity:.85}
.pgi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgi .mo{opacity:0;font-size:13px;color:var(--muted);padding:0 2px;border-radius:4px}
.pgi:hover .mo{opacity:1}
.pgi .mo:hover{background:#e2e6f0;color:var(--ink)}
.pgi.drop{box-shadow:inset 0 -2px 0 var(--accent)}
#sidefoot{border-top:1px solid var(--line);padding:6px 8px 8px}
#sidefoot .pgi{font-size:12.4px}
#saveState{font-size:10.6px;color:var(--muted);padding:4px 8px 0;line-height:1.35}

/* ============ кнопки и чипы ============ */
.btn{font-size:12.2px;font-weight:600;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#f3f5fa;color:var(--ink);border-color:#d8dde9}
.btn.pri{background:var(--accent);border-color:transparent;color:#fff}
.btn.pri:hover{background:#2843b5;color:#fff}
.btn.act{background:var(--accent-bg);border-color:var(--accent-br);color:var(--accent)}
.btn.dgr{color:var(--red);border-color:var(--red-br)}
.btn.dgr:hover{background:var(--red-bg)}
.btn[disabled]{opacity:.38;cursor:default;pointer-events:none}
.btn.sm{font-size:11.4px;padding:3px 8px}
.btn.ico{padding:5px 7px}
.chip{font-size:11.6px;font-weight:600;padding:3px 10px;border-radius:13px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink2);user-select:none;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip:hover{background:#f3f5fa}
.chip.on{color:#fff;border-color:transparent;background:#3d4657}
.chip .dt{width:7px;height:7px;border-radius:50%;display:inline-block}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.spacer{flex:1}
.hint{font-size:11.6px;color:var(--muted)}
.kbd{font:600 10.5px ui-monospace,Menlo,monospace;background:#eef0f6;border:1px solid #dfe3ec;border-bottom-width:2px;border-radius:4px;padding:1px 4px;color:var(--ink2)}

/* ============ меню ============ */
.menu{position:relative;display:inline-block}
.mlist{display:none;position:absolute;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh2);padding:5px;min-width:230px;z-index:120}
.menu.open>.mlist{display:block}
.mlist.right{right:0;top:calc(100% + 5px)} .mlist.left{left:0;top:calc(100% + 5px)}
.mi{padding:6px 9px;font-size:12.4px;border-radius:6px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.mi:hover{background:#f1f3f9;color:var(--ink)}
.mi small{display:block;color:var(--muted);font-size:10.4px;font-weight:400}
.mi .k{margin-left:auto;font-size:10px;color:var(--muted)}
.mi.dgr{color:var(--red)} .mi.dgr:hover{background:var(--red-bg)}
.mlist hr{border:none;border-top:1px solid var(--line2);margin:4px 2px}
.mlist .cap{font-size:9.6px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#a6acbb;padding:6px 9px 3px}

/* ============ холст ============ */
#cv{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,#dfe3ec 1px,transparent 0) 0 0/22px 22px, #fbfcfe;cursor:default}
#cv.pan{cursor:grab} #cv.panning{cursor:grabbing} #cv.linking{cursor:crosshair}
#scene{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path.hit{stroke-width:14;stroke:transparent;fill:none;pointer-events:stroke;cursor:pointer}
.lanebg{position:absolute;border-left:1px dashed #dfe3ec;pointer-events:none}
.lanecap{position:absolute;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#aeb4c3;pointer-events:none;white-space:nowrap}
.nd{position:absolute;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px 8px 13px;
   box-shadow:var(--sh1);user-select:none;cursor:grab}
.nd:hover{box-shadow:var(--sh2);border-color:#ccd3e3}
.nd .bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:9px 0 0 9px}
.nd.shp-pill .bar{border-radius:22px 0 0 22px}
.nd .nt{font-size:12.4px;font-weight:700;line-height:1.26;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:46px}
.nd .ns{font-size:10.5px;color:var(--muted);line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nd .bdg{position:absolute;right:7px;top:7px;display:flex;gap:3px}
.nd .b{font-size:9.4px;font-weight:800;border-radius:9px;padding:1px 6px;line-height:1.5}
.b.blk{background:var(--red-bg);color:var(--red);border:1px solid var(--red-br)}
.b.wt{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-br)}
.b.pin{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-br)}
.nd.shp-pill{border-radius:22px;background:#fffdf6;border-color:var(--amber-br)}
.nd.shp-di{border-radius:10px;background:#f7f4ff;border-color:#ded3f6}
.nd.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-br),var(--sh2)}
.nd.dim{opacity:.2}
.nd.anc{box-shadow:0 0 0 2px var(--red-br),var(--sh1)}
.nd.dsc{box-shadow:0 0 0 2px var(--green-br),var(--sh1)}
.nd.drag{cursor:grabbing;z-index:20;box-shadow:var(--sh3)}
.nd .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.nd .nte{outline:none;cursor:text}
.port{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--accent);
  opacity:0;transition:opacity .1s;cursor:crosshair;z-index:22}
.nd:hover .port,.port.live{opacity:1}
.port:hover{transform:scale(1.35)}
.port.r{right:-7px;top:50%;margin-top:-6.5px} .port.l{left:-7px;top:50%;margin-top:-6.5px}
.port.t{top:-7px;left:50%;margin-left:-6.5px} .port.b{bottom:-7px;left:50%;margin-left:-6.5px}
.nd.droptgt{box-shadow:0 0 0 3px var(--accent)}
.fr{position:absolute;border:1.5px solid #d7dbe6;border-radius:12px;background:rgba(255,255,255,.42)}
.fr.lane{border-style:dashed;background:rgba(240,242,248,.5)}
.fr .fh{position:absolute;top:-21px;left:0;font-size:11px;font-weight:750;color:#767d8f;background:transparent;
  padding:1px 5px;border-radius:5px;cursor:grab;white-space:nowrap;user-select:none}
.fr .fh:hover{background:#eceff6}
.fr.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-br)}
.fr .rs{position:absolute;right:-5px;bottom:-5px;width:12px;height:12px;border:1.5px solid var(--accent);background:#fff;border-radius:3px;cursor:nwse-resize;opacity:0}
.fr:hover .rs,.fr.sel .rs{opacity:1}
.stk{position:absolute;background:#fff8c8;border:1px solid #eadf9a;border-radius:8px;padding:8px 10px;font-size:12px;
  line-height:1.4;box-shadow:var(--sh1);cursor:grab;white-space:pre-wrap;overflow:hidden}
.stk.sel{box-shadow:0 0 0 2px var(--accent-br),var(--sh1);border-color:var(--accent)}
.stk .rs{position:absolute;right:-5px;bottom:-5px;width:12px;height:12px;border:1.5px solid var(--accent);background:#fff;border-radius:3px;cursor:nwse-resize;opacity:0}
.stk:hover .rs,.stk.sel .rs{opacity:1}
.stk .txt{outline:none;min-height:16px}
.fr{pointer-events:none}
.fr .fh,.fr .rs{pointer-events:auto}
#marq{position:absolute;border:1px solid var(--accent);background:rgba(51,85,209,.09);pointer-events:none;display:none;z-index:60}
#mini{position:absolute;right:12px;bottom:12px;width:190px;height:126px;background:rgba(255,255,255,.93);border:1px solid var(--line);
  border-radius:9px;box-shadow:var(--sh1);z-index:30;cursor:pointer}
#zoombar{position:absolute;left:12px;bottom:12px;z-index:30;display:flex;gap:5px;background:rgba(255,255,255,.93);
  border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:var(--sh1);align-items:center}
#cvintro{background:#fff;border-bottom:1px solid var(--line);border-left:3px solid var(--accent);padding:7px 14px;font-size:12.2px;color:var(--ink2);line-height:1.45;position:relative}
#cvintro b{color:var(--ink)}
#cvintro .x{position:absolute;right:8px;top:5px;cursor:pointer;color:var(--muted);font-size:14px;padding:0 5px;border-radius:5px}
#cvintro .x:hover{background:#eef0f6}
#cvstack{position:absolute;inset:0;display:flex;flex-direction:column}
#cvhost{position:relative;flex:1;min-height:0}
#ctx{position:fixed;z-index:200;display:none}
#ctx.open{display:block}
#ctx .mlist{display:block;position:static}

/* ============ таблица ============ */
.tblwrap{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:auto;box-shadow:var(--sh1)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12.6px}
table.grid th{position:sticky;top:0;z-index:5;background:#fbfbfd;text-align:left;font-size:10.2px;text-transform:uppercase;
  letter-spacing:.4px;color:var(--muted);font-weight:750;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.grid th:hover{color:var(--ink)}
table.grid th .ar{opacity:.5;font-size:9px}
table.grid td{padding:5px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.grid tr:hover td{background:#fafbfe}
table.grid tr.selrow td{background:var(--accent-bg)}
table.grid td.nm{font-weight:650}
table.grid .grouphd td{background:#f2f4fa;font-weight:750;font-size:11.4px;color:var(--ink2);padding:6px 10px;position:sticky;top:29px}
.cellin{border:1px solid transparent;background:transparent;border-radius:5px;padding:2px 5px;font-size:12.5px;width:100%;color:inherit;font-weight:inherit}
.cellin:hover{border-color:var(--line);background:#fff}
.cellin:focus{border-color:var(--accent);background:#fff;outline:none;box-shadow:0 0 0 2px var(--accent-bg)}
select.cellsel{border:1px solid transparent;background:transparent;font-size:11.6px;padding:2px 4px;border-radius:5px;font-weight:650;cursor:pointer;max-width:100%}
select.cellsel:hover{border-color:var(--line);background:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:11px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
.catdot{width:4px;height:14px;border-radius:2px;display:inline-block;vertical-align:-2px;margin-right:7px}
#bulk{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#1b1f2a;color:#fff;border-radius:11px;
  padding:8px 12px;display:flex;gap:8px;align-items:center;box-shadow:var(--sh3);z-index:40;opacity:0;transition:.18s;pointer-events:none;flex-wrap:wrap;max-width:92%}
#bulk.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#bulk .btn{background:#2c3242;border-color:#3b4254;color:#dfe3ee}
#bulk .btn:hover{background:#39405280;color:#fff}
#bulk select{background:#2c3242;border:1px solid #3b4254;color:#dfe3ee;border-radius:7px;padding:4px 7px;font-size:12px}

/* ============ канбан ============ */
.kb{display:flex;gap:12px;align-items:flex-start;height:100%;overflow-x:auto;padding:4px 2px 20px}
.kbcol{min-width:262px;width:262px;background:#f1f3f8;border-radius:11px;padding:8px;display:flex;flex-direction:column;max-height:100%}
.kbcol.over{background:var(--accent-bg);outline:2px dashed var(--accent-br)}
.kbh{display:flex;align-items:center;gap:7px;font-size:12.2px;font-weight:750;padding:2px 4px 8px;color:var(--ink2)}
.kbh .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.kbl{overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:34px;padding-bottom:2px}
.kc{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px 8px 12px;position:relative;cursor:grab;box-shadow:var(--sh1)}
.kc:hover{box-shadow:var(--sh2)}
.kc.drag{opacity:.45}
.kc .bar{position:absolute;left:0;top:0;bottom:0;width:3.5px;border-radius:9px 0 0 9px}
.kc .t{font-size:12.3px;font-weight:650;line-height:1.3}
.kc .s{font-size:10.6px;color:var(--muted);margin-top:2px}
.kc .m{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;align-items:center}

/* ============ дашборд ============ */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;box-shadow:var(--sh1)}
.tile .n{font-size:22px;font-weight:760;line-height:1.15;letter-spacing:-.5px}
.tile .l{font-size:10.6px;color:var(--muted);margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh1)}
.card h3{margin:0 0 10px;font-size:13.5px;font-weight:750}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}
.barrow{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12.4px}
.barrow .lb{flex:0 0 44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.barrow .lb:hover{color:var(--accent)}
.barrow .bw{flex:1;height:8px;background:#eef0f6;border-radius:5px;overflow:hidden}
.barrow .bw i{display:block;height:100%;border-radius:5px}
.barrow .vv{width:34px;text-align:right;font-weight:700;font-size:11.6px}
.lrow{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.lrow:last-child{border:none}
.lrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.lrow .t:hover{color:var(--accent)}
.intro{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:10px 14px;
  font-size:12.6px;color:var(--ink2);margin-bottom:14px;box-shadow:var(--sh1)}
.intro b{color:var(--ink)}

/* ============ инспектор ============ */
#insp{width:0;min-width:0;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;transition:width .16s}
#insp.open{width:430px;min-width:430px}
#insp>*{min-width:430px}
#ih{padding:11px 16px 0;border-bottom:1px solid var(--line);position:relative}
#ih h3{margin:0;font-size:15px;font-weight:750;padding-right:30px;line-height:1.3}
#iclose{position:absolute;right:11px;top:11px;border:none;background:#f0f2f7;border-radius:6px;width:25px;height:25px;cursor:pointer;color:var(--ink2);font-size:14px}
#iclose:hover{background:#e4e8f1}
#imeta{font-size:11.6px;color:var(--ink2);margin-top:5px}
#itabs{display:flex;gap:2px;margin-top:9px}
#itabs .t{font-size:12px;font-weight:650;padding:5px 10px;border-radius:7px 7px 0 0;cursor:pointer;color:var(--ink2);border:1px solid transparent;border-bottom:none;margin-bottom:-1px}
#itabs .t.on{background:#fff;border-color:var(--line);color:var(--accent)}
#ib{padding:10px 16px 40px;overflow:auto;flex:1}
.sect{font-size:10.2px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:16px 0 6px}
.kv{font-size:12.2px;color:var(--ink2);margin-top:5px}
.kv b{color:var(--ink)}
.body{font-size:12.9px;line-height:1.55;background:#f7f9fd;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 13px;white-space:pre-wrap}
.tag{display:inline-block;font-size:11px;font-weight:650;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-br);
  border-radius:11px;padding:2px 9px;margin:3px 4px 0 0;cursor:pointer}
.tag:hover{background:#e2e8fa}
.chk{border-bottom:1px solid var(--line2);padding:7px 0}
.chk:last-child{border:none}
.chk.blk{background:#fef7f6;margin:0 -8px;padding:7px 8px;border-radius:6px;border-bottom:none}
.chk .t{font-weight:650;font-size:12.4px}
.chk .z{font-size:11.6px;color:var(--ink2);margin-top:2px}
.draft{display:inline-block;font-size:9.4px;font-weight:800;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-br);
  border-radius:9px;padding:1px 7px;margin-left:6px;letter-spacing:0;text-transform:none}

/* ============ формы ============ */
.f{margin-top:10px}
.f>label,.flab{display:block;font-size:10.2px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font-size:12.8px;color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:6px 9px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.frow{display:flex;gap:9px}.frow>.f{flex:1;min-width:0}
.cbx{display:inline-flex;align-items:center;gap:6px;font-size:12.4px;color:var(--ink2);cursor:pointer;user-select:none}
.cbx input{width:15px;height:15px;accent-color:var(--accent)}
.picker{border:1px solid var(--line);border-radius:8px;padding:5px;max-height:180px;overflow:auto;background:#fcfcfe}
.pk{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:5px;font-size:12.2px;cursor:pointer}
.pk:hover{background:var(--accent-bg)}
.pk input{accent-color:var(--accent)}
.pk .id{font-size:9.6px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin-left:auto}
.lrw{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.ib{border:1px solid var(--line);background:#fff;border-radius:6px;width:26px;height:26px;min-width:26px;cursor:pointer;color:var(--ink2);font-size:12px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:#f2f4fa;color:var(--ink)}
.ib.dgr:hover{background:var(--red-bg);color:var(--red);border-color:var(--red-br)}
.crow{border:1px solid var(--line);border-radius:8px;padding:7px;margin-bottom:6px;background:#fcfcfe}
.crow .h{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.swatch{width:26px;height:26px;padding:1px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:#fff}

/* ============ модалка, оверлеи ============ */
#modal{position:fixed;inset:0;background:rgba(16,20,32,.45);z-index:300;display:none;align-items:center;justify-content:center;padding:24px}
#modal.open{display:flex}
#mbox{background:#fff;border-radius:14px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:var(--sh3)}
#mbox h3{margin:0 0 10px;font-size:17px;font-weight:750}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);background:#1b1f2a;color:#fff;font-size:12.6px;
  padding:9px 16px;border-radius:9px;z-index:400;opacity:0;transition:.2s;pointer-events:none;max-width:70vw;box-shadow:var(--sh3)}
#toast.on{opacity:1;transform:translateX(-50%)}
#pal{position:fixed;inset:0;background:rgba(16,20,32,.35);z-index:310;display:none;justify-content:center;padding-top:12vh}
#pal.open{display:flex}
#palbox{background:#fff;border-radius:13px;width:min(620px,92vw);height:fit-content;max-height:70vh;box-shadow:var(--sh3);overflow:hidden;display:flex;flex-direction:column}
#palin{border:none;border-bottom:1px solid var(--line);border-radius:0;padding:13px 16px;font-size:14.5px}
#palin:focus{box-shadow:none;border-color:var(--line)}
#pallist{overflow:auto;padding:6px}
.pr{padding:7px 11px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:12.8px}
.pr.on{background:var(--accent-bg)}
.pr .s{color:var(--muted);font-size:11px;margin-left:auto}
#projects{position:fixed;inset:0;background:var(--bg);z-index:250;overflow:auto;display:none}
#projects.open{display:block}
.pwrap{max-width:1080px;margin:0 auto;padding:52px 26px 60px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px;cursor:pointer;box-shadow:var(--sh1);position:relative;transition:.13s}
.pcard:hover{box-shadow:var(--sh2);transform:translateY(-1px);border-color:#ccd3e3}
.pcard .t{font-size:14.5px;font-weight:750;margin-bottom:3px}
.pcard .d{font-size:12px;color:var(--ink2);min-height:34px;line-height:1.4}
.pcard .m{font-size:10.8px;color:var(--muted);margin-top:9px;display:flex;gap:9px;align-items:center}
.pcard .x{position:absolute;right:9px;top:9px;opacity:0;font-size:14px;color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:5px}
.pcard:hover .x{opacity:1} .pcard .x:hover{background:var(--red-bg);color:var(--red)}
.pcard.new{border-style:dashed;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--accent);min-height:118px;background:#fdfdff}
.pcard.new .t{color:var(--accent)}
body.viewer .noview{display:none!important}

/* ============ тёмная тема ============ */
body.dark{
  --ink:#e7eaf3; --ink2:#a7afc2; --muted:#7b8397; --line:#2b3140; --line2:#232936;
  --bg:#0e1117; --card:#171b24; --accent:#6b8bff; --accent-bg:#1b2338; --accent-br:#374468;
  --red:#ef8b82; --red-bg:#39221f; --red-br:#5d332e;
  --amber:#e5b24d; --amber-bg:#382c14; --amber-br:#5a4620;
  --green:#5cc27f; --green-bg:#173423; --green-br:#265039;
  --grey:#9aa2b3; --grey-bg:#232936; --grey-br:#333a49;
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 4px 14px rgba(0,0,0,.5); --sh3:0 16px 46px rgba(0,0,0,.6);
  color-scheme:dark;
}
body.dark{--side-bg:#12151d;--surf2:#1e232e;--hov:#222836}
body.dark #side{background:var(--side-bg)}
body.dark #topbar,body.dark #pagebar,body.dark #cvintro{background:var(--card)}
body.dark #projBtn,body.dark .btn,body.dark .chip,body.dark .mlist,body.dark .nd,body.dark .port,
body.dark .fr .rs,body.dark .stk .rs,body.dark .tblwrap,body.dark .kc,body.dark .tile,body.dark .card,
body.dark .intro,body.dark #insp,body.dark input[type=text],body.dark input[type=number],
body.dark input[type=date],body.dark select,body.dark textarea,body.dark .ib,body.dark .swatch,
body.dark #mbox,body.dark #palbox,body.dark .pcard,body.dark .body{background:var(--card)}
body.dark .btn:hover,body.dark .chip:hover,body.dark .mi:hover,body.dark .cellin:hover,
body.dark select.cellsel:hover,body.dark .cellin:focus,body.dark .ib:hover,body.dark #iclose,
body.dark .pgi:hover,body.dark .sidecap .add:hover,body.dark .pgi .mo:hover,body.dark #cvintro .x:hover,
body.dark table.grid tr:hover td,body.dark #iclose:hover{background:var(--surf2)}
body.dark .btn:hover{border-color:var(--accent-br)}
body.dark .btn.pri,body.dark .btn.pri:hover{color:#fff}
body.dark .chip.on{background:#3d4657;color:#fff}
body.dark #itabs .t.on{background:var(--card)}
body.dark table.grid th{background:var(--surf2)}
body.dark table.grid .grouphd td{background:var(--surf2)}
body.dark .kbcol{background:var(--surf2)}
body.dark .barrow .bw,body.dark .kbd{background:var(--surf2)}
body.dark .kbd{border-color:var(--line)}
body.dark #cv{background:radial-gradient(circle at 1px 1px,#2a3140 1px,transparent 0) 0 0/22px 22px,#0d1017}
body.dark .lanebg{border-left-color:#2a3140}
body.dark .lanecap{color:#5c6478}
body.dark .nd.shp-pill{background:#211d0f;border-color:var(--amber-br)}
body.dark .nd.shp-di{background:#1e1830;border-color:#3a2f57}
body.dark .nd:hover{border-color:#3d465a}
body.dark .fr{border-color:#39414f;background:rgba(255,255,255,.04)}
body.dark .fr.lane{background:rgba(120,130,150,.06)}
body.dark .fr .fh{color:#8b93a6}

body.dark .stk{background:#3a3320;border-color:#5a4f2a;color:#f0ead0}
body.dark #mini,body.dark #zoombar{background:rgba(23,27,36,.92)}
body.dark .cellin:focus{box-shadow:0 0 0 2px var(--accent-br)}
body.dark ::-webkit-scrollbar-thumb{background:#39414f;background-clip:padding-box}

body.dark .pcard:hover,body.dark #projBtn:hover,body.dark .nd:hover{border-color:#3d465a}
body.dark .pcard.new{background:var(--surf2)}
body.dark .chk.blk{background:var(--red-bg)}
body.dark input:focus,body.dark select:focus,body.dark textarea:focus{box-shadow:0 0 0 3px var(--accent-bg)}
body.dark .picker,body.dark .crow{background:var(--surf2)}
</style>

/* ---------- хранилище: IndexedDB ---------- */
const DBNAME = 'graphstudio', STORE = 'projects', META = 'meta', SNAP = 'snaps';
let idb = null;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DBNAME, 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, {keyPath: 'id'});
      if (!d.objectStoreNames.contains(META)) d.createObjectStore(META, {keyPath: 'k'});
      if (!d.objectStoreNames.contains(SNAP)) d.createObjectStore(SNAP, {keyPath: 'id'});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    if (!idb) return rej(new Error('нет БД'));
    const t = idb.transaction(store, mode), s = t.objectStore(store);
    const rq = fn(s);
    t.oncomplete = () => res(rq && rq.result);
    t.onerror = () => rej(t.error);
  });
}
const dbPut = (store, v) => tx(store, 'readwrite', s => s.put(v));
const dbGet = (store, k) => tx(store, 'readonly', s => s.get(k));
const dbAll = store => tx(store, 'readonly', s => s.getAll());
const dbDel = (store, k) => tx(store, 'readwrite', s => s.delete(k));

/* ---------- граф: слои, вес, критический путь ---------- */
let _g = null;
function gInval() { _g = null; }
function G() {
  if (_g) return _g;
  const ids = new Set(P.nodes.map(n => n.id));
  const kids = {}, par = {}, layer = {}, hardPar = {};
  P.nodes.forEach(n => {kids[n.id] = []; par[n.id] = []; hardPar[n.id] = [];});
  P.links.forEach(l => {
    if (!ids.has(l.from) || !ids.has(l.to)) return;
    const blocking = !!ltOf(l.type).blocking;
    kids[l.from].push({id: l.to, lid: l.id, soft: !blocking});
    par[l.to].push({id: l.from, lid: l.id, soft: !blocking});
    if (blocking) hardPar[l.to].push(l.from);
  });
  const seen = {};
  const L = id => {
    if (layer[id] !== undefined) return layer[id];
    if (seen[id]) return 0; seen[id] = 1;
    const d = hardPar[id] || [];
    layer[id] = d.length ? Math.max(...d.map(L)) + 1 : 0;
    return layer[id];
  };
  P.nodes.forEach(n => L(n.id));
  const reach = (id, map) => {
    const s = new Set(), st = map[id].map(x => x.id);
    while (st.length) {const x = st.pop(); if (s.has(x)) continue; s.add(x); (map[x] || []).forEach(y => st.push(y.id));}
    return s;
  };
  const DESC = {}, ANC = {};
  P.nodes.forEach(n => {DESC[n.id] = reach(n.id, kids); ANC[n.id] = reach(n.id, par);});
  const W = id => (DESC[id] || new Set()).size;
  const memo = {}, nxt = {};
  const f = id => {
    if (memo[id] !== undefined) return memo[id];
    memo[id] = 0; let best = 0, b = null;
    kids[id].filter(k => !k.soft).forEach(k => {const v = f(k.id); if (v > best) {best = v; b = k.id;}});
    nxt[id] = b; memo[id] = best + DESC[id].size + 1; return memo[id];
  };
  P.nodes.forEach(n => f(n.id));
  let start = null, len = -1;
  P.nodes.filter(n => par[n.id].length === 0).forEach(n => {if (memo[n.id] > len) {len = memo[n.id]; start = n.id;}});
  const crit = new Set(); let c = start; while (c) {crit.add(c); c = nxt[c];}
  _g = {kids, par, layer, DESC, ANC, W, crit, hardPar};
  return _g;
}
const stepOf = n => (n.lane != null && n.lane !== '') ? +n.lane : G().layer[n.id];
function hasCycle() {
  const st = {}; let cyc = false;
  const ids = new Set(P.nodes.map(n => n.id));
  const adj = {}; P.nodes.forEach(n => adj[n.id] = []);
  P.links.forEach(l => {if (ids.has(l.from) && ids.has(l.to)) adj[l.from].push(l.to);});
  const go = id => {
    if (st[id] === 2) return; if (st[id] === 1) {cyc = true; return;}
    st[id] = 1; adj[id].forEach(go); st[id] = 2;
  };
  P.nodes.forEach(n => go(n.id));
  return cyc;
}

/* ---------- фильтр страницы ---------- */
function matchFilter(n, flt) {
  if (!flt) return true;
  if (flt.cats && flt.cats.length && !flt.cats.includes(n.cat)) return false;
  if (flt.statuses && flt.statuses.length && !flt.statuses.includes(n.status)) return false;
  if (flt.types && flt.types.length && !flt.types.includes(n.type)) return false;
  if (flt.blockersOnly && !nBlockers(n)) return false;
  if (flt.f) for (const k in flt.f) {
    const want = flt.f[k]; if (!want || !want.length) continue;
    const v = (n.f || {})[k];
    if (Array.isArray(v)) {if (!v.some(x => want.includes(x))) return false;}
    else if (!want.includes(v)) return false;
  }
  if (flt.q) {
    const q = flt.q.toLowerCase();
    const hay = [n.name, n.sub, n.id, n.body, ...Object.values(n.f || {}).flat(), ...(n.checks || []).map(c => c.t + ' ' + c.z)].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function pageNodes(pg) { return P.nodes.filter(n => matchFilter(n, pg.filter)); }

/* ---------- авто-раскладка ---------- */
function autoLayout(nodes) {
  const g = G(), ids = new Set(nodes.map(n => n.id));
  const pos = {};
  if (!nodes.length) return {pos, lanes: []};
  const dl = {}, sn = {};
  const DL = id => {
    if (dl[id] !== undefined) return dl[id];
    if (sn[id]) return 0; sn[id] = 1;
    const d = (g.hardPar[id] || []).filter(x => ids.has(x));
    const lv = x => {const nx = nodeById(x); return (nx.lane != null && nx.lane !== '') ? +nx.lane : DL(x);};
    dl[id] = d.length ? Math.max(...d.map(lv)) + 1 : 0; return dl[id];
  };
  nodes.forEach(n => DL(n.id));
  const CO = n => (n.lane != null && n.lane !== '') ? +n.lane : dl[n.id];
  const maxL = Math.max(...nodes.map(CO), 0);
  const raw = []; for (let i = 0; i <= maxL; i++) raw[i] = nodes.filter(n => CO(n) === i);
  const cols = [], capIdx = [];
  raw.forEach((c, i) => {if (c.length) {cols.push(c); capIdx.push(i);}});
  const ord = {};
  cols.forEach((c, li) => {
    const inCol = new Set(c.map(n => n.id)), lv = {}, s2 = {};
    const LV = id => {
      if (lv[id] !== undefined) return lv[id];
      if (s2[id]) return 0; s2[id] = 1;
      const d = (g.hardPar[id] || []).filter(x => inCol.has(x));
      lv[id] = d.length ? Math.max(...d.map(LV)) + 1 : 0; return lv[id];
    };
    c.forEach(n => LV(n.id));
    c.sort((a, b) => (li ? lv[a.id] - lv[b.id] : 0) || g.W(b.id) - g.W(a.id) || String(a.cat).localeCompare(String(b.cat)));
    c.forEach((n, i) => {ord[n.id] = i; n._lv = lv[n.id] || 0;});
  });
  for (let it = 0; it < 6; it++) {
    const dir = it % 2 === 0, seq = dir ? cols : [...cols].reverse();
    seq.forEach(c => {
      c.forEach(n => {
        const r = (dir ? g.par[n.id] : g.kids[n.id]).filter(x => ids.has(x.id)).map(x => ord[x.id]);
        n._bc = r.length ? r.reduce((a, b) => a + b, 0) / r.length : ord[n.id];
      });
      c.sort((a, b) => (a._lv || 0) - (b._lv || 0) || g.W(b.id) - g.W(a.id) || a._bc - b._bc);
      c.forEach((n, i) => ord[n.id] = i);
    });
  }
  const subs = cols.map(c => {
    const mx = Math.max(...c.map(n => n._lv || 0), 0), gg = [];
    for (let i = 0; i <= mx; i++) gg.push(c.filter(n => (n._lv || 0) === i).sort((a, b) => ord[a.id] - ord[b.id]));
    return gg;
  });
  const maxRows = Math.max(...subs.flat().map(x => x.length), 1);
  const colX = []; let x = PADX;
  subs.forEach(gr => {colX.push(x); x += gr.length * NW + (gr.length - 1) * SUBGAP + COLGAP;});
  subs.forEach((gr, li) => gr.forEach((grp, si) => {
    const total = grp.length * (NH + ROWGAP) - ROWGAP;
    const y0 = PADY + (maxRows * (NH + ROWGAP) - ROWGAP - total) / 2;
    grp.forEach((n, i) => pos[n.id] = {x: colX[li] + si * (NW + SUBGAP), y: y0 + i * (NH + ROWGAP)});
  }));
  const H = PADY + maxRows * (NH + ROWGAP) + 40;
  return {pos, lanes: colX.map((cx, i) => ({x: cx, idx: capIdx[i], h: H}))};
}
function layoutPage(pg, nodes) {
  const auto = autoLayout(nodes);
  const pos = {}, pid = pg.id;
  if (pg.canvas.layout === 'auto') {
    nodes.forEach(n => pos[n.id] = npos(n, pid) || (n.pinned && n.x != null ? {x: n.x, y: n.y} : (auto.pos[n.id] || {x: 0, y: 0})));
    laneInfo = auto.lanes;
  } else {
    let seeded = false;
    nodes.forEach(n => {
      let p = npos(n, pid);
      if (!p) {
        p = (n.x != null && n.y != null) ? {x: n.x, y: n.y} : (auto.pos[n.id] || {x: 0, y: 0});
        setNpos(n, pid, p.x, p.y); seeded = true;
      }
      pos[n.id] = {x: p.x, y: p.y};
    });
    laneInfo = [];
    if (seeded) save();
  }
  return pos;
}

function wireEdit(n) {
  const B = $('ib');
  const soft = () => {save(); paintNodesSafe(); stalePages();};
  qsa('[data-k]', B).forEach(el => {
    const k = el.dataset.k;
    const rd = () => el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.value;
    if (el.tagName === 'SELECT' || el.type === 'checkbox') el.onchange = () => {
      if (el.value === '__new__') {
        if (k === 'lane') {el.value = n.lane == null ? '' : n.lane; createLane(n);}
        else {el.value = n[k] || ''; createSchemaItem(k, n);}
        return;
      }
      snapNow();
      if (k === 'lane') {const v = rd(); if (v === '') n.lane = null; else n.lane = +v;}
      else n[k] = rd();
      gInval(); save(); renderPage(); openNode(n.id);
    };
    else el.oninput = () => {snapshot(); n[k] = el.value; if (k === 'name') $('ititle').textContent = el.value; soft();};
  });
  qsa('[data-f]', B).forEach(el => {
    const k = el.dataset.f, f = fieldOf(k);
    const rd = () => f.type === 'checkbox' ? (el.checked ? 1 : 0) : f.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value;
    if (el.tagName === 'SELECT' || el.type === 'checkbox') el.onchange = () => {
      if (el.value === '__new__') {el.value = (n.f || {})[k] || ''; createFieldOption(k, n); return;}
      snapNow(); fset(n, 'f.' + k, rd()); save(); renderPage(); openNode(n.id);
    };
    else el.oninput = () => {snapshot(); fset(n, 'f.' + k, rd()); soft();};
  });
  qsa('[data-list]', B).forEach(box => {
    const k = box.dataset.list;
    qsa('[data-li]', box).forEach(el => el.oninput = () => {snapshot(); n.f[k][+el.dataset.li] = el.value; save();});
    qsa('[data-ldel]', box).forEach(el => el.onclick = () => {snapNow(); n.f[k].splice(+el.dataset.ldel, 1); save(); openNode(n.id);});
  });
  qsa('[data-ladd]', B).forEach(el => el.onclick = () => {
    snapNow(); const k = el.dataset.ladd; n.f = n.f || {}; n.f[k] = n.f[k] || []; n.f[k].push(''); save(); openNode(n.id);
  });
  qsa('[data-dep]', B).forEach(el => el.onchange = () => {
    const [type, from] = el.dataset.dep.split('|');
    snapNow();
    P.links = P.links.filter(l => !(l.to === n.id && l.from === from));
    if (el.checked) P.links.push({id: uid('l'), from, to: n.id, type});
    gInval();
    if (hasCycle()) {P.links = P.links.filter(l => !(l.to === n.id && l.from === from)); gInval(); toast('Отклонено: цикл зависимостей');}
    save(); renderPage(); openNode(n.id);
  });
  qsa('.crow', B).forEach(row => {
    const i = +row.dataset.ci;
    qsa('[data-c]', row).forEach(el => {
      const k = el.dataset.c;
      const set = () => {n.checks[i][k] = el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.value;};
      if (el.tagName === 'SELECT' || el.type === 'checkbox') el.onchange = () => {snapNow(); set(); save(); renderPage(); openNode(n.id);};
      else el.oninput = () => {snapshot(); set(); soft();};
    });
    row.querySelector('[data-cup]').onclick = () => {if (i) {snapNow(); const t = n.checks[i - 1]; n.checks[i - 1] = n.checks[i]; n.checks[i] = t; save(); openNode(n.id);}};
    row.querySelector('[data-cdn]').onclick = () => {if (i < n.checks.length - 1) {snapNow(); const t = n.checks[i + 1]; n.checks[i + 1] = n.checks[i]; n.checks[i] = t; save(); openNode(n.id);}};
    row.querySelector('[data-cdel]').onclick = () => {snapNow(); n.checks.splice(i, 1); save(); renderPage(); openNode(n.id);};
  });
  $('chkAdd').onclick = () => {
    snapNow(); n.checks = n.checks || [];
    n.checks.push({t: 'Новая веха', s: P.schema.statuses[P.schema.statuses.length - 1].key, z: '', b: 0});
    save(); renderPage(); openNode(n.id);
  };
  $('unpin').onclick = () => {snapNow(); if (n.p) delete n.p[UI.page]; n.pinned = 0; save(); renderPage(); openNode(n.id);};
  $('idf').onchange = () => {
    const v = $('idf').value.trim();
    if (!v || v === n.id) {$('idf').value = n.id; return;}
    if (nodeById(v)) {toast('ID уже занят'); $('idf').value = n.id; return;}
    snapNow();
    P.links.forEach(l => {if (l.from === n.id) l.from = v; if (l.to === n.id) l.to = v;});
    const old = n.id; n.id = v;
    if (UI.sel.has(old)) {UI.sel.delete(old); UI.sel.add(v);}
    gInval(); save(); renderPage(); openNode(v); toast('ID изменён, связи обновлены');
  };
  $('dupN').onclick = () => {setSel([n.id]); duplicateSelection();};
  $('delN').onclick = () => {setSel([n.id]); deleteSelection();};
}

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if (e.code === 'Space' && !typing) {UI.spaceDown = true; const c = $('cv'); if (c) c.classList.add('pan');}
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'k') {e.preventDefault(); openPalette(); return;}
  if (e.key === 'Escape') {
    if ($('pal').classList.contains('open')) {$('pal').classList.remove('open'); return;}
    if ($('modal').classList.contains('open')) {closeModal(); return;}
    if ($('projects').classList.contains('open') && P) {$('projects').classList.remove('open'); return;}
    setSel([]); closeInsp(); return;
  }
  if (typing) return;
  if (mod && e.key.toLowerCase() === 'z') {e.preventDefault(); e.shiftKey ? redo() : undo(); return;}
  if (mod && e.key.toLowerCase() === 's') {e.preventDefault(); exportProject(); return;}
  if (VIEWER) return;
  if (mod && e.key.toLowerCase() === 'a' && curPage().kind === 'canvas') {e.preventDefault(); setSel(cvNodes.map(n => n.id)); return;}
  if (mod && e.key.toLowerCase() === 'd') {e.preventDefault(); duplicateSelection(); return;}
  if (mod && e.key.toLowerCase() === 'c' && UI.sel.size) {e.preventDefault(); copySelection(); return;}
  if (mod && e.key.toLowerCase() === 'v') {e.preventDefault(); pasteSelection(); return;}
  if (mod && e.key.toLowerCase() === 'g') {e.preventDefault(); if (UI.sel.size) addFrame('frame'); return;}
  if (e.key === 'Delete' || e.key === 'Backspace') {e.preventDefault(); deleteSelection(); return;}
  if (e.key === 'n' && curPage().kind === 'canvas') {addNode(); return;}
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key) && UI.sel.size && curPage().kind === 'canvas') {
    e.preventDefault();
    const d = e.shiftKey ? 1 : GRID;
    const dx = e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0;
    const dy = e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0;
    snapshot();
    selArr().forEach(n => {
      cvPos[n.id].x += dx; cvPos[n.id].y += dy; setNpos(n, curPage().id, cvPos[n.id].x, cvPos[n.id].y);
      if (curPage().canvas.layout === 'auto') n.pinned = 1;
    });
    updatePositions([...UI.sel]); save();
  }
});

function facetCounts(pg) {

  base.forEach(n => {

function cellValue(n, c) {

    return esc(Array.isArray(v) ? v.join(', ') : (v == null ? '' : v));
  }
  return esc(cellValue(n, c));
}

function boardCols(pg) {
  const by = pg.board.groupBy;
  if (by === 'status') return P.schema.statuses.map(s => ({k: s.key, n: s.name, c: s.color}));
  if (by === 'cat') return P.schema.categories.map(s => ({k: s.key, n: s.name, c: s.color}));
  if (by === 'type') return P.schema.nodeTypes.map(s => ({k: s.key, n: s.name}));
  if (by === 'step') return uniq(pageNodes(pg).map(stepOf)).sort((a, b) => a - b).map(s => ({k: String(s), n: 'шаг ' + s}));
  const f = fieldOf(by.replace(/^f\./, ''));
  return ((f && f.options) || []).map(o => ({k: o, n: o})).concat([{k: '', n: '— пусто —'}]);
}
function renderBoard(pg) {

    h += `<div class="kbcol" data-k="${esc(c.k)}">
      <div class="kbh">${c.c ? `<span class="dt" style="background:${c.c};width:9px;height:9px;border-radius:50%"></span>` : ''}${esc(c.n)}<span class="n">${list.length}</span></div>

          ${nBlockers(n) ? `<span class="pill" style="color:var(--red);background:var(--red-bg)">⚠${nBlockers(n)}</span>` : ''}
          ${g.W(n.id) >= 3 ? `<span class="pill" style="color:var(--accent);background:var(--accent-bg)">${g.W(n.id)}</span>` : ''}</div>
      </div>`).join('')}</div>

    </div>`;

  qsa('.kbcol').forEach(col => {
    col.ondragover = e => {e.preventDefault(); col.classList.add('over');};
    col.ondragleave = () => col.classList.remove('over');
    col.ondrop = e => {

    };
  });
}

function renderDash(pg) {
  const ns = pageNodes(pg), g = G();
  const links = P.links.filter(l => ns.some(n => n.id === l.from) && ns.some(n => n.id === l.to));
  const blk = ns.reduce((a, n) => a + nBlockers(n), 0);
  const checks = ns.reduce((a, n) => a + (n.checks || []).length, 0);
  const ready = ns.filter(n => (g.par[n.id] || []).length === 0);
  const drafts = ns.filter(n => n.draft).length;
  const byStatus = P.schema.statuses.map(s => ({...s, n: ns.filter(x => x.status === s.key).length})).filter(x => x.n);
  const byCat = P.schema.categories.map(c => ({...c, n: ns.filter(x => x.cat === c.key).length})).filter(x => x.n).sort((a, b) => b.n - a.n);
  const top = ns.slice().sort((a, b) => g.W(b.id) - g.W(a.id)).slice(0, 12);
  const crit = ns.filter(n => g.crit.has(n.id)).sort((a, b) => stepOf(a) - stepOf(b));
  const blkList = [];
  ns.forEach(n => (n.checks || []).filter(c => c.b).forEach(c => blkList.push({n, c})));
  blkList.sort((a, b) => g.W(b.n.id) - g.W(a.n.id));
  const maxW = Math.max(1, ...top.map(n => g.W(n.id)));
  const bar = (label, n, max, color, id) => `<div class="barrow"><div class="lb" ${id ? `data-jump="${esc(id)}"` : ''}>${esc(label)}</div>
    <div class="bw"><i style="width:${Math.max(3, n / max * 100)}%;background:${color}"></i></div><div class="vv">${n}</div></div>`;
  let h = '';
  if (pg.dash && pg.dash.intro) h += `<div class="intro">${pg.dash.intro}</div>`;
  h += `<div class="tiles">
    <div class="tile"><div class="n">${ns.length}</div><div class="l">узлов</div></div>
    <div class="tile"><div class="n">${links.length}</div><div class="l">связей</div></div>
    <div class="tile"><div class="n" style="color:var(--red)">${blk}</div><div class="l">блокеров</div></div>
    <div class="tile"><div class="n">${checks}</div><div class="l">вех всего</div></div>
    <div class="tile"><div class="n" style="color:var(--amber)">${ready.length}</div><div class="l">без входящих — можно брать</div></div>
    <div class="tile"><div class="n">${crit.length}</div><div class="l">на критическом пути</div></div>
    ${drafts ? `<div class="tile"><div class="n" style="color:var(--amber)">${drafts}</div><div class="l">черновиков</div></div>` : ''}
  </div>`;
  h += `<div class="cards2">
    <div class="card"><h3>Топ по весу — что разблокирует больше всего</h3>${top.map(n => bar(n.name, g.W(n.id), maxW, catOf(n.cat).color, n.id)).join('')}</div>
    <div class="card"><h3>Статусы</h3>${byStatus.map(s => bar(s.name, s.n, Math.max(...byStatus.map(x => x.n)), s.color)).join('')}
      <h3 style="margin-top:16px">Категории</h3>${byCat.map(c => bar(c.name, c.n, Math.max(...byCat.map(x => x.n)), c.color)).join('')}</div>
  </div>`;
  h += `<div class="cards2">
    <div class="card"><h3>Критический путь (${crit.length})</h3>
      ${crit.map(n => `<div class="lrow"><span class="catdot" style="background:${catOf(n.cat).color}"></span>
        <span class="t" data-jump="${esc(n.id)}">${esc(n.name)}</span>${pillOf(n.status)}</div>`).join('') || '<div class="kv">—</div>'}</div>
    <div class="card"><h3>Можно брать сейчас (${ready.length})</h3>
      ${ready.sort((a, b) => g.W(b.id) - g.W(a.id)).slice(0, 14).map(n => `<div class="lrow"><span class="catdot" style="background:${catOf(n.cat).color}"></span>
        <span class="t" data-jump="${esc(n.id)}">${esc(n.name)}</span><b style="font-size:11.5px">${g.W(n.id)}</b>${pillOf(n.status)}</div>`).join('') || '<div class="kv">—</div>'}</div>
  </div>`;
  if (blkList.length) h += `<div class="card"><h3>Блокеры (${blkList.length})</h3>
    <table class="grid"><thead><tr><th>Блокер</th><th>Держит</th><th>Статус</th><th>Последствие</th></tr></thead><tbody>
    ${blkList.map(x => `<tr><td class="nm">${esc(x.c.t)}${x.c.z ? `<div style="font-weight:400;font-size:11.4px;color:var(--muted)">${esc(x.c.z)}</div>` : ''}</td>
      <td><span class="t" data-jump="${esc(x.n.id)}" style="cursor:pointer;color:var(--accent);font-weight:650">${esc(x.n.name)}</span></td>
      <td>${pillOf(x.c.s)}</td>
      <td style="font-size:11.8px;color:var(--ink2)">→ ${g.W(x.n.id)} узлов ниже</td></tr>`).join('')}
    </tbody></table></div>`;
  $('view').innerHTML = `<div class="scroller">${h}</div>`;
  qsa('[data-jump]').forEach(el => el.onclick = () => jumpToNode(el.dataset.jump));
}

const _pageNodes = pageNodes;
pageNodes = function (pg) {
  let ns = _pageNodes(pg);
  if (pg.kind === 'canvas' && pg.canvas) {
    const g = G();
    if (pg.canvas.crit) ns = ns.filter(n => g.crit.has(n.id));
    if (pg.canvas.ready) ns = ns.filter(n => (g.par[n.id] || []).length === 0);
  }
  return ns;
};

    statuses: ['Статусы', () => S.statuses.map((t, i) => `<div class="crow" data-i="${i}" data-s="statuses">

      });

        save(); rewire(); renderPage();
      };
    };
    rewire();
    b.querySelector('[data-a=c]').onclick = () => {closeModal(); renderPage();};
  });
}

    issues.push({level: 'error', cat: 'Дубли ID', msg: `ID «${id}» встречается ${seen[id]} раз(а) — граф работает непредсказуемо`, node: id}));
  P.links.forEach(l => {
    const bf = !idset.has(l.from), bt = !idset.has(l.to);
    if (bf || bt) issues.push({level: 'error', cat: 'Битая связь',
      msg: `${l.from} → ${l.to}: ${bf && bt ? 'нет обоих узлов' : bf ? 'нет источника' : 'нет цели'}`,
      fix: {label: 'Удалить связь', run: () => {P.links = P.links.filter(x => x.id !== l.id);}}});
  });
  const lseen = {};
  P.links.forEach(l => {const k = l.from + '→' + l.to + '·' + l.type; lseen[k] = (lseen[k] || 0) + 1;});
  Object.keys(lseen).filter(k => lseen[k] > 1).forEach(k =>
    issues.push({level: 'warn', cat: 'Дубли связей', msg: `Связь ${k} задана ${lseen[k]} раз(а)`,
      fix: {label: 'Свести к одной', run: () => {
        const parts = k.split('·'), tp = parts.pop(), ft = parts.join('·').split('→');
        let kept = false;
        P.links = P.links.filter(l => {
          if (l.from === ft[0] && l.to === ft[1] && l.type === tp) {if (kept) return false; kept = true;}
          return true;
        });
      }}}));
  if (hasCycle()) issues.push({level: 'error', cat: 'Цикл зависимостей',
    msg: 'В графе есть цикл — слои, вес и критический путь считаются неверно. Найдите и разверните лишнюю связь.'});
  const selectFields = P.schema.fields.filter(f => (f.type === 'select' || f.type === 'list') && (f.options || []).length);
  P.nodes.forEach(n => {
    const nm = n.name || n.id;
    if (!n.name || !String(n.name).trim()) issues.push({level: 'warn', cat: 'Пустое название',
      msg: `Узел ${n.id} без названия`, node: n.id, fix: {label: 'Назвать по ID', run: () => {n.name = n.id;}}});
    if (n.status && !sk.has(n.status)) issues.push({level: 'warn', cat: 'Статус вне схемы',
      msg: `${nm}: статус «${n.status}» отсутствует в схеме`, node: n.id,
      fix: {label: 'Сбросить', run: () => {n.status = P.schema.statuses[P.schema.statuses.length - 1].key;}}});
    if (n.cat && !ck.has(n.cat)) issues.push({level: 'warn', cat: 'Категория вне схемы',
      msg: `${nm}: категория «${n.cat}» отсутствует в схеме`, node: n.id,
      fix: {label: 'Сбросить', run: () => {n.cat = P.schema.categories[0].key;}}});
    if (n.type && !tk.has(n.type)) issues.push({level: 'warn', cat: 'Тип вне схемы',
      msg: `${nm}: тип «${n.type}» отсутствует в схеме`, node: n.id,
      fix: {label: 'Сбросить', run: () => {n.type = P.schema.nodeTypes[0].key;}}});
    selectFields.forEach(f => {
      const v = (n.f || {})[f.key]; if (v == null || v === '') return;
      const bad = (Array.isArray(v) ? v : [v]).filter(x => !(f.options || []).includes(x));
      if (bad.length) issues.push({level: 'warn', cat: 'Значение вне списка',
        msg: `${nm}: поле «${f.label}» = «${bad.join(', ')}» вне заданных вариантов`, node: n.id,
        fix: {label: 'Очистить', run: () => {fset(n, 'f.' + f.key, '');}}});
    });
    if (!(g.kids[n.id] || []).length && !(g.par[n.id] || []).length)
      issues.push({level: 'info', cat: 'Изолированный узел', msg: `${nm} не связан ни с чем`, node: n.id});
  });
  const order = {error: 0, warn: 1, info: 2};
  issues.sort((a, b) => order[a.level] - order[b.level]);

}
function showValidator() {

  const ic = l => l === 'error' ? '⛔' : l === 'warn' ? '⚠️' : 'ℹ️';
  const fixable = issues.filter(i => i.fix);

    <div class="mfoot">
      ${fixable.length ? `<button class="btn" data-a="fixall">Починить всё возможное (${fixable.length})</button>` : ''}

function isLegacy(d) { return d && Array.isArray(d.nodes) && d.nodes.length && (d.nodes[0].deps !== undefined || d.nodes[0].t !== undefined) && !d.schema; }
function fromLegacy(d) {
  const boards = d.boards || [{id: 'main', name: 'Карта', lanes: []}];
  const pr = {
    id: uid('pr'), name: (d.meta && d.meta.title) || 'Импортированный проект',
    desc: (d.meta && d.meta.intro || '').replace(/<[^>]+>/g, '').slice(0, 200), created: today(), updated: today(),
    schema: {
      nodeTypes: [{key: 'stage', name: 'Этап', shape: 'rect'}, {key: 'gate', name: 'Гейт', shape: 'pill'}],
      statuses: Object.keys(d.statuses || {}).map(k => ({key: k, name: d.statuses[k].name, color: d.statuses[k].color})),
      categories: Object.keys(d.tracks || {}).map(k => ({key: k, name: d.tracks[k].name, color: d.tracks[k].color})),
      linkTypes: [{key: 'hard', name: 'Жёсткая блокировка', color: '#9aa1b2', style: 'solid', blocking: 1},
        {key: 'soft', name: 'Мягкая связь', color: '#c9a227', style: 'dashed', blocking: 0}],
      fields: [{key: 'board', label: 'Доска', type: 'select', options: boards.map(b => b.name), card: 0},
        {key: 'wave', label: 'Волна', type: 'select', options: d.waves || [], card: 1},
        {key: 'gate', label: 'Гейт на вход', type: 'text', card: 0},
        {key: 'note', label: 'Контекст', type: 'longtext', card: 0},
        {key: 'contains', label: 'Что входит', type: 'list', card: 0}]
    },
    nodes: [], links: [], frames: [], notes: [], pages: []
  };
  if (!pr.schema.statuses.length) pr.schema.statuses = [{key: 'na', name: 'без статуса', color: '#a8aebd'}];
  const bn = {}; boards.forEach(b => bn[b.id] = b.name);
  d.nodes.forEach(n => {
    const f = {board: bn[n.board] || boards[0].name};
    if (n.wv) f.wave = n.wv; if (n.gate) f.gate = n.gate; if (n.note) f.note = n.note;
    if ((n.cont || []).length) f.contains = n.cont;
    pr.nodes.push({id: n.id, name: n.t || n.name || n.id, sub: n.s || '', type: n.type || 'stage',
      status: n.st || 'na', cat: n.track || (pr.schema.categories[0] || {key: ''}).key,
      body: n.d || '', draft: n.draft ? 1 : 0, lane: n.col == null ? null : n.col,
      x: n.fx != null ? n.fx : null, y: n.fy != null ? n.fy : null, pinned: n.fx != null ? 1 : 0,
      f, checks: (n.m || []).map(m => ({t: m.v, s: m.s, b: m.b ? 1 : 0, z: m.z || ''}))});
  });
  d.nodes.forEach(n => {
    (n.deps || []).forEach(x => pr.links.push({id: uid('l'), from: x, to: n.id, type: 'hard'}));
    (n.soft || []).forEach(x => pr.links.push({id: uid('l'), from: x, to: n.id, type: 'soft'}));
  });
  pr.pages.push({id: uid('p'), name: 'Обзор', kind: 'dash', filter: {q: '', cats: [], statuses: [], types: [], f: {}}});
  boards.forEach(b => pr.pages.push({id: uid('p'), name: b.name, kind: 'canvas',
    filter: {q: '', cats: [], statuses: [], types: [], f: {board: [b.name]}},
    canvas: {layout: 'auto', lanes: b.lanes || [], intro: b.intro || ''}}));
  pr.pages.push({id: uid('p'), name: 'Все узлы', kind: 'table',
    filter: {q: '', cats: [], statuses: [], types: [], f: {}},
    table: {cols: ['name', 'cat', 'status', 'step', 'weight', 'checks'], sort: 'step', dir: 1, group: ''}});
  return pr;
}
function normalize(pr) {
  pr.id = pr.id || uid('pr'); pr.frames = pr.frames || []; pr.notes = pr.notes || []; pr.links = pr.links || [];
  pr.schema = pr.schema || {}; const S = pr.schema;
  S.nodeTypes = S.nodeTypes || [{key: 'stage', name: 'Узел', shape: 'rect'}];
  S.statuses = S.statuses || [{key: 'na', name: 'без статуса', color: '#a8aebd'}];
  S.categories = S.categories || [{key: 'gen', name: 'Общее', color: '#3355d1'}];
  S.linkTypes = S.linkTypes || [{key: 'hard', name: 'Жёсткая', color: '#9aa1b2', style: 'solid', blocking: 1}];
  S.fields = S.fields || [];
  pr.nodes.forEach(n => {n.f = n.f || {}; n.checks = n.checks || []; n.sub = n.sub || ''; n.body = n.body || ''; n.p = n.p || {};});
  if (!pr.pages || !pr.pages.length) pr.pages = [{id: uid('p'), name: 'Холст', kind: 'canvas',
    filter: {q: '', cats: [], statuses: [], types: [], f: {}}, canvas: {layout: 'auto', lanes: []}}];
  pr.pages.forEach(p => {p.filter = p.filter || {q: '', cats: [], statuses: [], types: [], f: {}};
    if (p.kind === 'canvas') p.canvas = p.canvas || {layout: 'auto', lanes: []};});
  return pr;
}
function importJson(mode) {
  pickFile('.json', async txt => {
    let d; try {d = JSON.parse(txt);} catch (e) {toast('Не JSON: ' + e.message); return;}
    if (d.graphstudio && Array.isArray(d.projects)) {
      for (const pr of d.projects) {pr.id = pr.id || uid('pr'); await dbPut(STORE, normalize(pr));}
      await loadProjects(); showProjects(); toast('Восстановлено проектов: ' + d.projects.length); return;
    }
    const pr = isLegacy(d) ? fromLegacy(d) : normalize(d);
    if (mode === 'merge') {
      snapNow();
      let a = 0, u = 0;
      pr.nodes.forEach(n => {const c = nodeById(n.id); if (c) {Object.assign(c, n); u++;} else {P.nodes.push(n); a++;}});
      pr.links.forEach(l => {if (!P.links.some(x => x.from === l.from && x.to === l.to)) P.links.push(l);});
      ['statuses', 'categories', 'nodeTypes', 'linkTypes', 'fields'].forEach(k =>
        (pr.schema[k] || []).forEach(it => {if (!P.schema[k].some(x => x.key === it.key)) P.schema[k].push(it);}));
      gInval(); save(1); renderPage(); toast(`Слито: обновлено ${u}, добавлено ${a}`);
    } else {
      pr.id = uid('pr'); await dbPut(STORE, pr); await loadProjects(); openProject(pr.id);
      toast(`Проект «${pr.name}» импортирован: ${pr.nodes.length} узлов`);
    }
  });
}
function importCsv() {
  pickFile('.csv', txt => {
    const rows = parseCsv(txt); if (rows.length < 2) {toast('Пустой CSV'); return;}
    const head = rows[0].map(h => h.trim().toLowerCase());
    const ix = k => head.indexOf(k);
    const idc = ix('id') >= 0 ? ix('id') : -1, namec = ix('name') >= 0 ? ix('name') : ix('название');
    if (idc < 0 && namec < 0) {toast('Нужна колонка id или name'); return;}
    snapNow();
    let a = 0, u = 0;
    const findKey = (arr, v) => (arr.find(x => x.key === v) || arr.find(x => x.name.toLowerCase() === String(v).toLowerCase()) || {}).key;
    rows.slice(1).forEach(r => {
      const id = idc >= 0 ? (r[idc] || '').trim() : '';
      let n = id && nodeById(id);
      if (!n) {
        n = {id: id || uid('n'), name: namec >= 0 ? r[namec] : id, sub: '', type: P.schema.nodeTypes[0].key,
          status: P.schema.statuses[P.schema.statuses.length - 1].key, cat: P.schema.categories[0].key,
          body: '', draft: 0, lane: null, x: null, y: null, pinned: 0, f: {}, checks: []};
        P.nodes.push(n); a++;
      } else u++;
      const setIf = (col, fn) => {const c = ix(col); if (c >= 0 && r[c] !== undefined && r[c] !== '') fn(r[c].trim());};
      setIf('name', v => n.name = v); setIf('sub', v => n.sub = v); setIf('body', v => n.body = v);
      setIf('status', v => {const k = findKey(P.schema.statuses, v); if (k) n.status = k;});
      setIf('category', v => {const k = findKey(P.schema.categories, v); if (k) n.cat = k;});
      setIf('type', v => {const k = findKey(P.schema.nodeTypes, v); if (k) n.type = k;});
      P.schema.fields.forEach(f => setIf(f.key, v => n.f[f.key] = f.type === 'list' ? v.split('|').map(s => s.trim()) : v));
    });
    const dc = ix('deps');
    if (dc >= 0) rows.slice(1).forEach(r => {
      const id = idc >= 0 ? (r[idc] || '').trim() : null; if (!id || !nodeById(id)) return;
      (r[dc] || '').split(/[\s,;|]+/).filter(Boolean).forEach(from => {
        if (nodeById(from) && !P.links.some(l => l.from === from && l.to === id))
          P.links.push({id: uid('l'), from, to: id, type: P.schema.linkTypes[0].key});
      });
    });
    gInval(); save(1); renderPage(); toast(`CSV: добавлено ${a}, обновлено ${u}`);
  });
}

/* ==========================================================================
   FILE SYSTEM ACCESS — проекты как реальные файлы на диске (прогрессивное улучшение).
   Есть FSA (Chrome/Edge, secure context) → open/save в настоящий .json, автосейв в файл.
   Нет FSA (file://, Safari, Firefox) → откат на скачивание/загрузку, как раньше.
   Хэндлы файлов хранятся в meta store под ключом 'fh:<projectId>'.
   FSA объявлена выше (рядом с VIEWER).
   ========================================================================== */
const safeName = s => ((s || 'graph').replace(/[^\wа-яА-ЯёЁ\- ]/g, '').trim().replace(/\s+/g, '_') || 'graph');
async function fhGet(id) { try { const m = await dbGet(META, 'fh:' + id); return m && m.v; } catch (e) { return null; } }
async function fhSet(id, handle, name) { try { await dbPut(META, {k: 'fh:' + id, v: {handle, name}}); } catch (e) {} }
async function fhDel(id) { try { await dbDel(META, 'fh:' + id); } catch (e) {} }
async function fhAll() {
  try { const all = await dbAll(META); return (all || []).filter(x => String(x.k).startsWith('fh:')).map(x => ({id: x.k.slice(3), name: x.v && x.v.name, handle: x.v && x.v.handle})); }
  catch (e) { return []; }
}
async function verifyPerm(handle, write) {
  if (!handle || !handle.queryPermission) return true;
  const opts = {mode: write ? 'readwrite' : 'read'};
  try {
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    if ((await handle.requestPermission(opts)) === 'granted') return true;
  } catch (e) {}
  return false;
}
// Записи в файлы сериализуются глобально: две одновременные createWritable по одному файлу
// (например автосейв камеры + автосейв правки) иначе конфликтуют и могут обнулить файл.
let _writeLock = Promise.resolve();
function writeHandle(handle, text) {
  const op = _writeLock.then(async () => {
    const w = await handle.createWritable();
    await w.write(new Blob([text], {type: 'application/json'}));
    await w.close();
  });
  _writeLock = op.catch(() => {});
  return op;
}
async function openProjectFile() {

    const d = JSON.parse(await file.text());
    if (d.graphstudio && Array.isArray(d.projects)) {

    }
    const pr = isLegacy(d) ? fromLegacy(d) : normalize(d);
    pr.id = pr.id || uid('pr');
    await dbPut(STORE, pr);
    await fhSet(pr.id, handle, file.name);

/* ==========================================================================
   ПАПКА ХРАНИЛИЩА (vault) — как у Obsidian: одна папка, каждый проект = .json в ней.
   Хэндл папки лежит в meta 'vault'; список id проектов папки — в meta 'vaultIds'.
   IndexedDB становится кэшем папки. Смена папки → пересканирование и подтяжка файлов.
   ========================================================================== */
const DIRPICK = FSA && typeof window.showDirectoryPicker === 'function';
async function verifyDirPerm(dir, write) {
  if (!dir || !dir.queryPermission) return true;
  const opts = {mode: write ? 'readwrite' : 'read'};
  try {
    if ((await dir.queryPermission(opts)) === 'granted') return true;
    if ((await dir.requestPermission(opts)) === 'granted') return true;
  } catch (e) {}
  return false;
}
async function getVault() { const v = await dbGet(META, 'vault').catch(() => null); return v && v.v; }
// Прочитать все .json из папки в кэш IndexedDB, привязать хэндлы, убрать пропавшие. Возврат: число проектов.
async function loadVault(dir) {
  if (!(await verifyDirPerm(dir, true))) { toast('Нет доступа к папке'); return -1; }
  const oldIds = (await dbGet(META, 'vaultIds').catch(() => null) || {v: []}).v || [];
  const newIds = [];
  for await (const entry of dir.values()) {
    if (entry.kind !== 'file' || !/\.(json|gsgraph)$/i.test(entry.name)) continue;
    try {
      const raw = JSON.parse(await (await entry.getFile()).text());
      if (raw.graphstudio && Array.isArray(raw.projects)) continue; // бэкап-бандл пропускаем
      const pr = isLegacy(raw) ? fromLegacy(raw) : normalize(raw);
      pr.id = raw.id || ('vf_' + safeName(entry.name.replace(/\.[^.]+$/, '')));
      await dbPut(STORE, pr);
      await fhSet(pr.id, entry, entry.name);
      newIds.push(pr.id);
    } catch (e) { /* битый/чужой файл — пропускаем */ }
  }
  for (const id of oldIds) if (!newIds.includes(id)) { await dbDel(STORE, id).catch(() => {}); await fhDel(id); }
  await dbPut(META, {k: 'vault', v: {handle: dir, name: dir.name}});
  await dbPut(META, {k: 'vaultIds', v: newIds});
  return newIds.length;
}
async function chooseVault() {
  if (!DIRPICK) { toast('Выбор папки доступен в Chrome/Edge по http(s), не на file://'); return; }
  let dir; try { dir = await window.showDirectoryPicker({mode: 'readwrite', id: 'graphstudio-vault'}); } catch (e) { return; }
  const n = await loadVault(dir);
  if (n < 0) return;
  await loadProjects(); showProjects();
  toast(`Папка хранилища: «${dir.name}» · проектов: ${n}`);
}
async function refreshVault() {
  const v = await getVault(); if (!v || !v.handle) return;
  const n = await loadVault(v.handle);
  if (n < 0) return;
  await loadProjects(); showProjects(); toast('Обновлено из папки: ' + n);
}
async function disconnectVault() {
  await dbDel(META, 'vault'); await dbDel(META, 'vaultIds');
  showProjects(); toast('Папка отключена — проекты остаются в браузере');
}
// Записать новый проект файлом в папку хранилища (если она выбрана). true — записан.
async function vaultAddProject(pr) {
  const v = await getVault(); const dir = v && v.handle; if (!dir) return false;
  if (!(await verifyDirPerm(dir, true))) return false;
  const existing = new Set();
  try { for await (const e of dir.values()) existing.add(e.name); } catch (err) { return false; }
  const base = safeName(pr.name); let fname = base + '.json', i = 1;
  while (existing.has(fname)) fname = base + '_' + (++i) + '.json';
  try {
    const fh = await dir.getFileHandle(fname, {create: true});
    await writeHandle(fh, JSON.stringify(pr, null, 1));
    await fhSet(pr.id, fh, fname);
    const ids = (await dbGet(META, 'vaultIds').catch(() => null) || {v: []}).v || [];
    if (!ids.includes(pr.id)) { ids.push(pr.id); await dbPut(META, {k: 'vaultIds', v: ids}); }
    return true;
  } catch (e) { return false; }
}
// Обновить кнопку/строку статуса папки на стартовом экране.
async function refreshVaultUI() {
  const btn = $('pVault'), st = $('vaultStatus');
  if (!btn || !st) return;
  btn.classList.toggle('hidden', !DIRPICK);
  if (!DIRPICK) { st.textContent = 'Проекты хранятся в этом браузере. Папка-хранилище доступна в Chrome/Edge при запуске по http(s).'; return; }
  const v = await getVault();
  if (v && v.name) {
    btn.textContent = '📁 ' + v.name;
    st.innerHTML = `Хранилище: <b>${esc(v.name)}</b> — новые проекты пишутся сюда файлами. ` +
      `<a href="#" data-va="switch" style="color:var(--accent)">Сменить</a> · ` +
      `<a href="#" data-va="refresh" style="color:var(--accent)">Обновить из папки</a> · ` +
      `<a href="#" data-va="off" style="color:var(--muted)">Отключить</a>`;
    qsa('[data-va]', st).forEach(a => a.onclick = e => {
      e.preventDefault();
      const act = a.dataset.va;
      if (act === 'switch') chooseVault(); else if (act === 'refresh') refreshVault(); else disconnectVault();
    });
  } else {
    btn.textContent = '📁 Выбрать папку хранилища';
    st.innerHTML = 'Проекты пока только в браузере. <b>Выбери папку хранилища</b> — и все проекты будут лежать файлами на диске (можно синкать через iCloud/Dropbox/git).';
  }
}

/* ==========================================================================
   PWA — установка и оффлайн (service worker)
   ========================================================================== */
let deferredInstall = null;
function refreshInstallUI() {
  const on = !!deferredInstall;
  const a = $('pInstall'), b = $('navInstall');
  if (a) a.classList.toggle('hidden', !on);
  if (b) b.classList.toggle('hidden', !on);
}
async function doInstall() {
  if (!deferredInstall) {
    toast('Установка станет доступна в Chrome/Edge при запуске по http(s) — не по file://');
    return;
  }
  deferredInstall.prompt();
  try { await deferredInstall.userChoice; } catch (e) {}
  deferredInstall = null; refreshInstallUI();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; refreshInstallUI(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; refreshInstallUI(); toast('Graph Studio установлен'); });
if ($('pInstall')) $('pInstall').onclick = doInstall;
if ($('navInstall')) $('navInstall').onclick = doInstall;
if (!VIEWER && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

(async function boot() {
  if (VIEWER) {
    document.body.classList.add('viewer');
    P = normalize(SEED.project || SEED);
    document.title = P.name;
    $('projBtn').style.pointerEvents = 'none';
    UI.page = (P.pages[0] || {}).id;
    renderPages(); renderPage(); paintSave();
    return;
  }
  try { idb = await openDB(); } catch (e) { alert('Не удалось открыть локальную базу: ' + e.message); return; }
  try { const th = await dbGet(META, 'theme'); if (th && th.v === 'dark') applyTheme(true); } catch (e) {}
  // Папка хранилища: если доступ уже выдан (без запроса) — подтянуть файлы из неё.
  try {
    const v = await getVault();
    if (v && v.handle && v.handle.queryPermission && (await v.handle.queryPermission({mode: 'readwrite'})) === 'granted') await loadVault(v.handle);
  } catch (e) {}
  await loadProjects();
  // Пустая база → стартовый экран с шаблонами (демо-проект — один из шаблонов), ничего не создаём молча.
  const last = await dbGet(META, 'last');
  const live = PROJECTS.filter(p => !p.deleted);
  const id = last && live.some(p => p.id === last.v) ? last.v : (live[0] || {}).id;
  if (id) await openProject(id); else showProjects();
  const seen = await dbGet(META, 'seen');
  if (!seen) {await dbPut(META, {k: 'seen', v: 1}); setTimeout(showHelp, 600);}
})();

</script>
